services:
  - type: web
    name: resume-parser
    runtime: python
    rootDir: resume-parser
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
